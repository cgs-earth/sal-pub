{{/* The Edit note dialog, opened by the Edit buttons on the viewer's notes (static/app.js), which
     fill in the text. Save posts the edit to the outbox as an Update; Delete posts a Delete. Expects
     the page data. */}}
{{define "edit"}}
  <dialog id="edit" aria-labelledby="edit-title">
    <form>
      <h2 id="edit-title">Edit note</h2>
      <textarea name="content" rows="5" maxlength="{{.MaxNoteChars}}" aria-label="Note" required></textarea>
      <div class="actions">
        <button type="button" class="danger" id="edit-delete">Delete</button>
        <button type="submit" formmethod="dialog" formnovalidate>Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>
{{end}}
