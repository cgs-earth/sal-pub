services:
  caddy:
    build:
      context: docker/caddy
    environment:
      SALPUB_HOSTNAME: ${SALPUB_HOSTNAME}
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - keycloak
      - salpub
  salpub:
    build:
      context: .
    environment:
      SALPUB_HOSTNAME: ${SALPUB_HOSTNAME}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATABASE_URL: postgres://${KC_DB_USERNAME}:${KC_DB_PASSWORD}@postgres:5432/salpub?sslmode=disable
    depends_on:
      keycloak: 
        condition: service_healthy
    # Exits if Keycloak or Postgres isn't up yet; restart until they are.
    restart: unless-stopped
  keycloak:
    build:
      context: docker/keycloak
    env_file:
      - .env
    environment:
      # Must be a full URL including the relative path (KC_HOSTNAME_BACKCHANNEL_DYNAMIC).
      KC_HOSTNAME: ${SALPUB_HOSTNAME}/auth
    depends_on:
      postgres: 
        condition: service_healthy
    volumes:
      - ./docker/keycloak/themes/sal:/opt/keycloak/themes/sal
    healthcheck:
      # The Keycloak image has no curl/wget, so open a TCP connection with bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/0.0.0.0/8080"]
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KC_DB_USERNAME}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USERNAME} -d salpub"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 5

