services:
  caddy:
    build:
      context: docker/caddy
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - keycloak
  keycloak:
    build:
      context: docker/keycloak
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./docker/keycloak/themes/sal:/opt/keycloak/themes/sal
  postgres:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5432:5432"
